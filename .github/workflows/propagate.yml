# The real adoption path today is a RE-VENDOR PR in the consumer's own repo,
# following that repo's `vendor/README.md` (npm pack the published version, swap
# the tarball, rewrite the .sha256 manifest, update the `file:` reference).
#
# A correct rework would dispatch a re-vendor PR rather than an npm install, and
