#   DecisionGuideAI        "@talchain/schemas": "file:./vendor/talchain-schemas-0.22.0.tgz"
#   plot-lite-service      "@talchain/schemas": "file:./vendor/talchain-schemas-0.22.0.tgz"
#   olumi-assistants-service "@talchain/schemas": "file:./vendor/talchain-schemas-0.25.0.tgz"
# Running this matrix against any of them REWRITES the `file:` pin, and against
