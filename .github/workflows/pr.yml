name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # S0 contract-enforcement gates (arch step 2). Run BEFORE build/test so a
      # manifest, registry or compat break is reported as itself rather than as
      # a downstream type error.
      - name: Adoption manifest
        run: npm run check:adoption

      - name: Population registry
        run: npm run check:populations

      - name: Two-sided compat gate
        run: npm run check:compat

      - name: Generated contract constants are current
        run: npm run generate:contract-constants:check

      # Regeneration-diff check: src/contracts/generated-population-ref.ts must
      # be byte-identical to what the generator produces from the registry, so a
      # hand-edit OR a registry change without a regeneration fails loud.
      - name: Generated population ref matches the registry
        run: npm run generate:population-ref:check

      - name: Build
        run: npm run build

      # GRAPH TRUTH CONTRACT (Limb 0 + Limb 1). Runs AFTER build because it
      # reads the built contract, not the source — a field minted without a
      # semantic classification fails here rather than shipping unclassified.
      # A separate step so the failure is attributed to the contract gate and
      # not to the suite. Exit 2 (could-not-measure) fails this job exactly as
      # exit 1 does; that is deliberate.
      - name: Graph truth contract
        run: npm run check:graph-truth

      # The build config (`tsconfig.json`) excludes `tests` and `fixtures`, and
      # `lint` uses that same config — so until tsconfig.test.json existed, NO
      # test file was typechecked by anything here. Runs after Build because
      # tests that import `../dist/**` typecheck against the built .d.ts.
      # `npm test` runs this too; the separate step exists so the failure is
      # attributed to the typecheck rather than to the suite.
      - name: Typecheck tests, fixtures and scripts
        run: npm run typecheck:tests

      - name: Test
        run: npm test
